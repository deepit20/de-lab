name: 📚 Content — new lesson, exercise, question or correction
description: Suggest or report learning content (the most valuable kind of contribution!)
labels: [content]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind of content?
      options:
        - Correction / inaccuracy
        - New exercise
        - New lesson for an existing topic
        - New interview question
        - New topic or track
        - Other
    validations:
      required: true
  - type: input
    id: topic
    attributes:
      label: Topic
      placeholder: "e.g. dw-scd, spark-partitions"
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What should be added or changed? Links to sources are welcome.
    validations:
      required: true
  - type: checkboxes
    id: pr
    attributes:
      label: Contribution
      options:
        - label: I'd like to open a pull request for this myself (see CONTRIBUTING.md)
