name: ✨ Feature request
description: Suggest an improvement to the app
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What learning problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
