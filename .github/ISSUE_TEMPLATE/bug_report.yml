name: 🐞 Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where in the app?
      placeholder: "e.g. Practice → sql-joins-2, Revision session, Airflow playground"
  - type: input
    id: browser
    attributes:
      label: Browser & OS
      placeholder: "e.g. Edge 130 on Windows 11"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots / console errors
      description: Optional. Never paste API keys.
