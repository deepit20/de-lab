name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          npm ci
          pip install pandas
      - name: Typecheck & build
        run: npm run build
      - name: Validate every exercise (SQL, Python, PySpark & Airflow emulators)
        run: npm run validate
