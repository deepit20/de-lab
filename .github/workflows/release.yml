# Push a tag like v1.1.0 → builds the Windows-ready "DE Lab" folder and attaches DE-Lab.zip to a GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Zip
        run: cd release && zip -r DE-Lab.zip "DE Lab"
      - uses: softprops/action-gh-release@v2
        with:
          files: release/DE-Lab.zip
          generate_release_notes: true
